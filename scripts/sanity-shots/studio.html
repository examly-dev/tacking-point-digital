<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sanity Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --fg: #101112;
        --muted: #6e7683;
        --quiet: #8b939e;
        --border: #e3e4e8;
        --hover: #f4f5f7;
        --selected: #eef0f4;
        --focus: #2276fc;
        --brand: #f03e2f;
        --positive: #0d7a4f;
        --positive-bg: #e7f6ee;
        --caution: #9a6700;
        --caution-bg: #fff4d4;
        --btn: #1b1d25;
        --pane: 51px;
        --nav: 49px;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        color: var(--fg);
        background: #fff;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      button { font: inherit; color: inherit; background: none; border: 0; cursor: default; }
      svg { display: block; }

      .studio { display: flex; flex-direction: column; height: 100%; }

      /* Navbar — Studio v3.23+ / v4 */
      .nav {
        height: var(--nav);
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        padding: 0 10px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .nav-left, .nav-right { display: flex; align-items: center; gap: 6px; }
      .nav-right { justify-content: flex-end; }
      .nav-center { display: flex; justify-content: center; gap: 2px; }

      .icon-btn {
        width: 33px; height: 33px;
        display: grid; place-items: center;
        border-radius: 6px;
        color: var(--fg);
      }
      .home {
        width: 33px; height: 33px;
        border-radius: 7px;
        background: var(--brand);
        display: grid; place-items: center;
      }
      .workspace {
        display: flex; align-items: center; gap: 6px;
        height: 33px; padding: 0 8px 0 10px;
        border-radius: 6px;
        font-size: 13px; font-weight: 600;
      }
      .search {
        display: flex; align-items: center; gap: 8px;
        height: 33px; min-width: 168px; padding: 0 10px;
        border: 1px solid var(--border); border-radius: 6px;
        color: var(--quiet); font-size: 13px;
      }
      .search kbd {
        margin-left: auto;
        font: 11px Inter, sans-serif;
        color: var(--quiet);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 1px 5px;
      }
      .tool {
        display: flex; align-items: center; gap: 7px;
        height: 33px; padding: 0 11px;
        border-radius: 6px;
        font-size: 13px; font-weight: 500;
        color: var(--muted);
      }
      .tool.active { background: var(--selected); color: var(--fg); font-weight: 600; }
      .avatar {
        width: 25px; height: 25px; border-radius: 50%;
        display: grid; place-items: center;
        font-size: 10px; font-weight: 700; color: #fff;
        background: #3d4f6f;
      }
      .avatar.b { background: #c45c26; margin-left: -6px; box-shadow: 0 0 0 2px #fff; }

      /* Desk */
      .desk { display: flex; flex: 1; min-height: 0; }

      .pane {
        display: flex; flex-direction: column;
        border-right: 1px solid var(--border);
        min-width: 0;
      }
      .pane.types { width: 232px; flex-shrink: 0; }
      .pane.list { width: 292px; flex-shrink: 0; }
      .pane.editor { flex: 1; border-right: 0; }

      .pane-h {
        height: var(--pane);
        display: flex; align-items: center; gap: 8px;
        padding: 0 10px 0 14px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
        font-size: 13px; font-weight: 600;
      }
      .pane-h .grow { flex: 1; }
      .pane-h .sub { font-weight: 500; color: var(--muted); }

      .rows { overflow: hidden; padding: 6px 0; }
      .row {
        display: flex; align-items: center; gap: 10px;
        margin: 0 6px; padding: 8px 10px;
        border-radius: 6px;
      }
      .row.active { background: var(--selected); }
      .type-ico {
        width: 29px; height: 29px; border-radius: 7px;
        background: var(--hover);
        display: grid; place-items: center;
        color: var(--fg);
        flex-shrink: 0;
      }
      .row .name { font-size: 13px; font-weight: 500; line-height: 1.2; }
      .row .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
      .count { margin-left: auto; font-size: 12px; color: var(--quiet); }

      .doc-row { align-items: flex-start; padding: 10px 10px; }
      .dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: #3ab77d; margin-top: 6px; flex-shrink: 0;
      }
      .dot.draft { background: #e3a008; }

      /* Document editor */
      .doc-bar {
        height: var(--pane);
        display: flex; align-items: center; gap: 10px;
        padding: 0 14px 0 16px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .doc-bar .title { font-size: 13px; font-weight: 600; flex: 1; min-width: 0;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tabs { display: flex; gap: 2px; margin-right: 8px; }
      .tab {
        height: 29px; padding: 0 10px; border-radius: 6px;
        font-size: 13px; font-weight: 500; color: var(--muted);
      }
      .tab.on { background: var(--selected); color: var(--fg); font-weight: 600; }
      .badge {
        display: inline-flex; align-items: center; gap: 6px;
        height: 25px; padding: 0 9px;
        border-radius: 999px;
        font-size: 12px; font-weight: 600;
      }
      .badge.pub { background: var(--positive-bg); color: var(--positive); }
      .badge.draft { background: var(--caution-bg); color: var(--caution); }
      .ghost {
        height: 33px; padding: 0 11px; border-radius: 6px;
        font-size: 13px; font-weight: 500; color: var(--fg);
      }
      .publish {
        height: 33px; padding: 0 13px; border-radius: 6px;
        background: var(--btn); color: #fff;
        font-size: 13px; font-weight: 600;
      }

      .form-wrap {
        flex: 1; overflow: hidden;
        display: flex; justify-content: center;
        background: #fff;
      }
      .form {
        width: 100%; max-width: 42rem;
        padding: 28px 36px 40px;
      }

      .field { margin-bottom: 22px; position: relative; }
      .field.focus { padding: 12px; margin: -12px -12px 10px; border-radius: 8px;
        box-shadow: 0 0 0 1px var(--focus), 0 0 0 4px rgba(34, 118, 252, 0.18); }
      .field.changed::before {
        content: "";
        position: absolute; left: -18px; top: 2px; bottom: 2px;
        width: 3px; border-radius: 2px; background: var(--focus);
      }
      .flabel { font-size: 13px; font-weight: 600; }
      .fdesc { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
      .input {
        margin-top: 8px;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 10px 12px;
        font-size: 16px; line-height: 1.4;
        background: #fff;
        min-height: 41px;
      }
      .field.focus .input { border-color: transparent; }
      .input.area { min-height: 92px; }
      .caret {
        display: inline-block; width: 1.5px; height: 18px;
        background: var(--fg); margin-left: 1px; vertical-align: text-bottom;
        position: relative; top: 2px;
      }

      .pt { margin-top: 8px; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
      .pt-bar {
        display: flex; align-items: center; gap: 2px;
        padding: 5px 6px;
        border-bottom: 1px solid var(--border);
        background: #fafafa;
      }
      .pt-btn {
        width: 28px; height: 28px; border-radius: 4px;
        display: grid; place-items: center;
        font-size: 13px; font-weight: 700; color: var(--muted);
      }
      .pt-btn.on { background: var(--selected); color: var(--fg); }
      .pt-sep { width: 1px; height: 16px; background: var(--border); margin: 0 4px; }
      .pt-body { padding: 12px 14px; font-size: 16px; line-height: 1.5; min-height: 88px; }

      .array { margin-top: 8px; border: 1px solid var(--border); border-radius: 4px; }
      .aitem {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        font-size: 14px;
      }
      .aitem:last-of-type { border-bottom: 0; }
      .handle { color: var(--quiet); letter-spacing: -1px; }
      .add {
        display: flex; align-items: center; gap: 6px;
        padding: 9px 12px; font-size: 13px; font-weight: 500; color: var(--muted);
        border-top: 1px solid var(--border);
      }

      .locations {
        margin-top: 8px;
        display: flex; align-items: center; gap: 8px;
        font-size: 13px; color: var(--muted);
      }
      .locations a { color: var(--focus); font-weight: 500; text-decoration: none; }

      .hidden { display: none !important; }
    </style>
  </head>
  <body>

      <div class="desk">

        <section class="pane editor">
          <div class="doc-bar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--quiet)"><path d="M15 6l-6 6 6 6"/></svg>

            <div class="icon-btn">
              <svg width="16" height="16" viewBox="0 0 25 25" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="6" cy="12.5" r="1.2" fill="currentColor"/><circle cx="12.5" cy="12.5" r="1.2" fill="currentColor"/><circle cx="19" cy="12.5" r="1.2" fill="currentColor"/></svg>
            </div>
          </div>

    </div>

      function esc(s) {
        return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      }

      function fieldHtml(f) {
        const wrap = `field${f.focus ? " focus changed" : ""}`;
        if (f.kind === "locations") {
          return `<div class="locations">Appears on <a href="#">${esc(f.href)}</a></div>`;
        }
        let control = "";
        if (f.kind === "string") {
          const val = f.focus
            ? `${esc(f.value)}<span class="caret"></span>`
            : esc(f.value);
          control = `<div class="input">${f.prefix ? `<span style="color:var(--muted)">${esc(f.prefix)}</span>` : ""}${val}</div>`;
        } else if (f.kind === "text") {
          const val = f.focus ? `${esc(f.value)}<span class="caret"></span>` : esc(f.value);
          control = `<div class="input area">${val}</div>`;
        } else if (f.kind === "pt") {
          const val = f.focus ? `${esc(f.value)}<span class="caret"></span>` : esc(f.value);
          control = `<div class="pt">
            <div class="pt-bar">
              <div class="pt-btn on">B</div>
              <div class="pt-btn" style="font-style:italic;font-weight:600">I</div>
              <div class="pt-sep"></div>
              <div class="pt-btn">H</div>
              <div class="pt-btn">“</div>
              <div class="pt-sep"></div>
              <div class="pt-btn">
                <svg width="13" height="13" viewBox="0 0 25 25" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 8h10M8 12.5h10M8 17h7"/></svg>
              </div>
              <div class="pt-btn">
                <svg width="13" height="13" viewBox="0 0 25 25" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 8h10M8 12.5h10M8 17h7"/><path d="M5 8v.01M5 12.5v.01M5 17v.01"/></svg>
              </div>
              <div class="pt-sep"></div>
              <div class="pt-btn">
                <svg width="13" height="13" viewBox="0 0 25 25" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 8h7a4 4 0 0 1 0 8h-2"/><path d="M16 17H9a4 4 0 0 1 0-8h2"/></svg>
              </div>
            </div>
            <div class="pt-body">${val}</div>
          </div>`;
        } else if (f.kind === "array") {
          control = `<div class="array">
            ${(f.items || []).map((it) => `<div class="aitem"><span class="handle">⋮⋮</span>${esc(it)}</div>`).join("")}
            <div class="add"><svg width="13" height="13" viewBox="0 0 25 25" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12.5 5v15M5 12.5h15"/></svg> Add item</div>
          </div>`;
        }
        return `<div class="${wrap}">
          <div class="flabel">${esc(f.label)}</div>
          ${f.desc ? `<div class="fdesc">${esc(f.desc)}</div>` : ""}
          ${control}
        </div>`;
      }

      function render(key) {
        const site = SITES[key];
        if (!site) return;
        document.getElementById("workspace").textContent = site.workspace;
        document.getElementById("user-av").textContent = site.user;
        document.getElementById("list-title").textContent = site.listTitle;
        document.getElementById("doc-title").textContent = site.docTitle;

        document.getElementById("types").innerHTML = site.types.map((t) => `
          <div class="row${t.active ? " active" : ""}">
            <div class="type-ico">${I[t.icon] || I.doc}</div>
            <div class="name">${esc(t.label)}</div>
            <div class="count">${t.count}</div>
          </div>
        `).join("");

        document.getElementById("docs").innerHTML = site.docs.map((d) => `
          <div class="row doc-row${d.active ? " active" : ""}">
            <div class="dot${d.draft ? " draft" : ""}"></div>
            <div>
              <div class="name">${esc(d.title)}</div>
              <div class="meta">${esc(d.meta)}</div>
            </div>
          </div>
        `).join("");

        document.getElementById("form").innerHTML = site.fields.map(fieldHtml).join("");
      }

      const params = new URLSearchParams(location.search);
      render(params.get("site") || "proof-room");
    </script>
